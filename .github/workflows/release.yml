# Pushing a tag vX.Y.Z builds the release for the Mac and for Windows and creates ONE draft release with every asset:
# Seedwell-X.Y.Z.zip, Seedwell-X.Y.Z.dmg, Seedwell.dmg, install.sh, Seedwell-X.Y.Z-windows-x64.zip, install.ps1,
# SHA256SUMS and latest.json. The Mac's are Developer ID signed and notarized (the secrets: docs/RELEASING.md).
#
# All or nothing: the release starts only when the tag matches Cargo.toml and CI passed on the tagged commit; the Mac
# and Windows builds run side by side and a failure in one cancels the other; the draft is made only when both
# succeeded. When anything fails or is cancelled, the tag (and a draft, if one was made) is deleted again, so a fix
# is followed by a fresh tag of the same version. Publishing the draft stays a manual click: that is the moment every
# installed copy is offered the update (SPEC 12A).
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  actions: write   # a failing build cancels the run

concurrency:
  group: release-${{ github.ref }}

env:
  # The C# bindings' generator, pinned (the same in ci.yml, which caches its build under this tag).
  UNIFFI_CS_TAG: v0.11.1+v0.31.0

jobs:
  gate:
    name: Tag and CI
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - name: The tag matches the version in Cargo.toml
        run: |
          v=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p;}' Cargo.toml | head -1)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME but Cargo.toml says $v"; exit 1; }
      - name: CI passed on this commit (Mac and Windows)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The tag is pushed after main; CI may still be running. Wait for its run on this commit, at most an hour.
          for _ in $(seq 1 120); do
            read -r status conclusion url < <(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
                --event push --limit 1 --json status,conclusion,url --jq '.[0] | "\(.status) \(.conclusion) \(.url)"') || true
            if [ "${status:-}" = completed ]; then
              [ "$conclusion" = success ] && { echo "CI passed: $url"; exit 0; }
              echo "::error::CI on $GITHUB_SHA ended with $conclusion: $url"; exit 1
            fi
            echo "CI on $GITHUB_SHA: ${status:-not started yet}; waiting"
            sleep 30
          done
          echo "::error::no finished CI run on $GITHUB_SHA within an hour"; exit 1

  mac:
    name: Mac build
    needs: gate
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the release notes list the commits since the previous tag
      - name: Rust (version pinned in rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Developer ID certificate and notarization key (from the repository's secrets)
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          # A release is Developer ID signed and notarized, never ad hoc again.
          for s in MACOS_CERT_P12 MACOS_CERT_PASSWORD NOTARY_KEY_P8 NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            [ -n "${!s}" ] || { echo "::error::a release is Developer ID signed and notarized; set the secret $s (docs/RELEASING.md, One-time setup)"; exit 1; }
          done
          team=$(sed -n 's/^TEAM_ID=\([A-Z0-9]*\)$/\1/p' install.sh)
          kc="$RUNNER_TEMP/seedwell-signing.keychain-db"
          kc_pass=$(openssl rand -hex 24)
          # A keychain of this job's own, in the search list (codesign finds the identity there), unlocked for the
          # job and removed again in the last step.
          security create-keychain -p "$kc_pass" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kc_pass" "$kc"
          # shellcheck disable=SC2046 # the runner's keychain paths have no spaces
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$kc" -P "$MACOS_CERT_PASSWORD" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/developer-id.p12"
          # codesign and notarytool use the key without a prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pass" "$kc" >/dev/null
          # Apple's Developer ID intermediate, in case the runner lacks it (the chain must verify).
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
            && security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$kc" >/dev/null 2>&1 || true
          identity=$(security find-identity -v -p codesigning "$kc" | sed -n "s/.*\"\(Developer ID Application: .*($team)\)\"\$/\1/p" | head -1)
          [ -n "$identity" ] || { echo "::error::MACOS_CERT_P12 holds no valid Developer ID Application identity of team $team"; security find-identity -v -p codesigning "$kc"; exit 1; }
          printf '%s' "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials seedwell-notary --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" --keychain "$kc" >/dev/null
          rm -f "$RUNNER_TEMP/notary.p8"
          {
            echo "SEEDWELL_SIGN_IDENTITY=$identity"
            echo "SEEDWELL_NOTARY_PROFILE=seedwell-notary"
            echo "SEEDWELL_NOTARY_KEYCHAIN=$kc"
          } >> "$GITHUB_ENV"
          echo "Signing as: $identity"
      - name: Build, sign, notarize and check the Mac release
        run: |
          # Build numbers keep rising past the ones built locally before CI existed (0.1.0 was build 88).
          export SEEDWELL_BUILD=$((100 + GITHUB_RUN_NUMBER))
          app/release-zip.sh --signed
      - uses: actions/upload-artifact@v7
        with:
          name: mac
          path: |
            app/build/release/Seedwell-*.zip
            app/build/release/Seedwell-*.dmg
            app/build/release/Seedwell.dmg
            app/build/release/install.sh
            app/build/release/SHA256SUMS
            app/build/release/latest.json
            app/build/release/NOTES.md
          if-no-files-found: error
      - name: Remove the signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/seedwell-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notary.p8"
      - name: A failed build cancels the release
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"

  windows:
    name: Windows build
    needs: gate
    runs-on: windows-latest
    # The full-LTO build takes about 12 minutes on a 24-thread PC; a 4-vCPU runner is 4-6x slower.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - name: Rust (version pinned in rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      # The generator built once per pinned tag (ci.yml saves it on main; a tag run reads main's caches).
      - name: uniffi-bindgen-cs from the cache
        id: uniffi-cs
        uses: actions/cache@v6
        with:
          path: ~/.uniffi-bindgen-cs
          key: uniffi-bindgen-cs-${{ runner.os }}-${{ env.UNIFFI_CS_TAG }}
      - name: uniffi-bindgen-cs (the C# bindings' generator), when not cached
        if: steps.uniffi-cs.outputs.cache-hit != 'true'
        run: cargo install uniffi-bindgen-cs --git https://github.com/NordSecurity/uniffi-bindgen-cs --tag "$env:UNIFFI_CS_TAG" --root "$HOME/.uniffi-bindgen-cs"
      - name: uniffi-bindgen-cs on PATH
        run: Add-Content $env:GITHUB_PATH "$HOME\.uniffi-bindgen-cs\bin"
      - name: Build and check the Windows release
        shell: powershell
        run: app-windows\release-zip.ps1
      - name: The installer installs, updates, pins a version and uninstalls (local server, test registry keys)
        shell: powershell
        run: |
          app-windows\qa\install-test.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            app-windows/bin/release/Seedwell-*-windows-x64.zip
            app-windows/bin/release/install.ps1
            app-windows/bin/release/SHA256SUMS-windows
            app-windows/bin/release/latest-windows.json
          if-no-files-found: error
      - name: A failed build cancels the release
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"

  draft:
    name: Draft release
    needs: [mac, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: assets
      - name: The merge's own tests
        run: python3 -I tools/release_merge_test.py
      - name: One SHA256SUMS, one latest.json, one set of notes
        run: python3 -I tools/release-merge.py assets/mac assets/windows
      - name: Create the draft (not published)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${GITHUB_REF_NAME#v}
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "Seedwell $v" \
            --notes-file assets/mac/NOTES.md \
            assets/mac/Seedwell-"$v".zip assets/mac/install.sh assets/mac/Seedwell-"$v".dmg assets/mac/Seedwell.dmg \
            assets/windows/Seedwell-"$v"-windows-x64.zip assets/windows/install.ps1 \
            assets/mac/SHA256SUMS assets/mac/latest.json

  withdraw:
    name: Withdraw the tag
    needs: [gate, mac, windows, draft]
    if: failure() || cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete the draft, if one was made, and the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null \
            || gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$GITHUB_REF_NAME" \
            || true
          echo "::error::The release of $GITHUB_REF_NAME was withdrawn: fix the failure, then tag the version again."
          exit 1
