# Pushing a tag vX.Y.Z builds the release on GitHub and creates a DRAFT release with Seedwell-X.Y.Z.zip,
# install.sh, SHA256SUMS and latest.json. Publishing the draft is a manual click: that is the moment every
# installed copy is offered the update (SPEC 12A).
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the release notes list the commits since the previous tag
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: The tag matches the version in Cargo.toml
        run: |
          v=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p;}' Cargo.toml | head -1)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME but Cargo.toml says $v"; exit 1; }
      - name: Build and create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Build numbers keep rising past the ones built locally before CI existed (0.1.0 was build 88).
          export SEEDWELL_BUILD=$((100 + GITHUB_RUN_NUMBER))
          app/release-zip.sh --draft
