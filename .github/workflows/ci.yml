# One build, every test, on the Mac and on Windows. On the Mac the Rust test build (debug) is reused by the app
# build and the Swift tests; on Windows the app is built and its QA run (app-windows/qa/run.ps1: the renders and the
# behaviour checks, quiet). Clippy runs beside them on both, so the cfg(windows) code is linted too. A release starts
# only when this passed on the tagged commit (release.yml). Documentation-only changes do not run CI.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE-*", "bench/**", ".github/dependabot.yml"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE-*", "bench/**", ".github/dependabot.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Tests refuse to touch the real home folder.
  TRS_FORBID_REAL_HOME: "1"

jobs:
  test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Rust (version pinned in rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: dev
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Rust tests
        run: cargo nextest run --workspace --locked --profile ci
      - uses: actions/cache@v6
        with:
          path: app/.sparkle
          key: sparkle-${{ hashFiles('app/fetch-sparkle.sh') }}
      - name: App (reuses the test build)
        run: bash app/build.sh
        env:
          SEEDWELL_PROFILE: dev
      - name: Swift tests (reuse the app build)
        run: swift test --package-path app
      - name: Shell scripts
        run: |
          for f in install.sh app/build.sh app/release-zip.sh app/qa/update_e2e.sh; do bash -n "$f"; done
          if command -v shellcheck >/dev/null; then shellcheck -e SC1091 install.sh app/build.sh app/release-zip.sh; fi

  clippy:
    name: Clippy
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  windows:
    name: Windows build and test
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Rust (version pinned in rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Rust tests
        run: cargo nextest run --workspace --locked --profile ci
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: uniffi-bindgen-cs (the C# bindings' generator)
        run: cargo install uniffi-bindgen-cs --git https://github.com/NordSecurity/uniffi-bindgen-cs --tag v0.11.1+v0.31.0
      - name: PowerShell scripts parse
        shell: powershell
        run: |
          $bad = 0
          foreach ($f in @('install.ps1') + (Get-ChildItem app-windows -Recurse -Filter *.ps1 | ForEach-Object FullName)) {
            $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errors)
            if ($errors) { Write-Host "::error file=$f::$($errors[0].Message)"; $bad++ }
          }
          if ($bad) { exit 1 }
      - name: App and QA (renders and behaviour checks, quiet)
        shell: powershell
        run: app-windows\qa\run.ps1 all -Build

  clippy-windows:
    name: Clippy (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy-windows
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
