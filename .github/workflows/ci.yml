# Lint, tests and an app build on every push to main and every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Tests refuse to touch the real home folder.
  TRS_FORBID_REAL_HOME: "1"

jobs:
  rust:
    name: Rust (clippy, tests)
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked --no-fail-fast

  app:
    name: App (build, Swift tests, scripts)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      # Builds the Rust core, generates the Swift bindings the tests need, builds Seedwell.app.
      - run: bash app/build.sh
        env:
          SEEDWELL_FAST: "1"
      - run: swift test --package-path app
      - name: Shell scripts
        run: |
          for f in install.sh app/build.sh app/release-zip.sh app/qa/update_e2e.sh; do bash -n "$f"; done
          if command -v shellcheck >/dev/null; then shellcheck -e SC1091 install.sh app/release-zip.sh; fi
