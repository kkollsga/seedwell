# One build, every test. The Rust test build (debug) is reused by the app build and the Swift tests;
# clippy runs beside it as a check-only pass. Documentation-only changes do not run CI.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE-*", "bench/**", ".github/dependabot.yml"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE-*", "bench/**", ".github/dependabot.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Line tables keep panic locations and backtraces readable at a fraction of full debug info.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  # Tests refuse to touch the real home folder.
  TRS_FORBID_REAL_HOME: "1"

jobs:
  test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Rust (version pinned in rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: dev
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Rust tests
        run: cargo nextest run --workspace --locked --profile ci
      - uses: actions/cache@v6
        with:
          path: app/.sparkle
          key: sparkle-${{ hashFiles('app/fetch-sparkle.sh') }}
      - name: App (reuses the test build)
        run: bash app/build.sh
        env:
          SEEDWELL_PROFILE: dev
      - name: Swift tests (reuse the app build)
        run: swift test --package-path app
      - name: Shell scripts
        run: |
          for f in install.sh app/build.sh app/release-zip.sh app/qa/update_e2e.sh; do bash -n "$f"; done
          if command -v shellcheck >/dev/null; then shellcheck -e SC1091 install.sh app/build.sh app/release-zip.sh; fi

  clippy:
    name: Clippy
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
