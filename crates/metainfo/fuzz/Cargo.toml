[package]
name = "trs-metainfo-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
trs-metainfo = { path = ".." }

# An empty workspace table keeps this crate out of the root workspace.
[workspace]

[[bin]]
name = "metainfo"
path = "fuzz_targets/metainfo.rs"
test = false
doc = false
bench = false

[[bin]]
name = "magnet"
path = "fuzz_targets/magnet.rs"
test = false
doc = false
bench = false
