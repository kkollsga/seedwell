[package]
name = "seedwell-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "BitTorrent session engine: torrents, peers, picker, choker, limits, queue, tiers, persistence boundary and control API"

[dependencies]
seedwell-platform = { path = "../platform" }
seedwell-bencode = { path = "../bencode" }
seedwell-metainfo = { path = "../metainfo" }
seedwell-wire = { path = "../wire" }
seedwell-storage = { path = "../storage" }
seedwell-tracker = { path = "../tracker" }
# Developer mode: the masked, bounded log of tracker exchanges.
seedwell-devlog = { path = "../devlog" }
seedwell-dht = { path = "../dht" }
# Persistence adapter (`state_store`), settings types, rules and tracker profiles.
seedwell-state = { path = "../state" }
# Content detection and placement templates (organizer, SPEC 7A).
seedwell-classify = { path = "../classify" }
# Direct HTTP(S) downloads (SPEC 7D).
seedwell-http = { path = "../http" }
# uTP (BEP 29) on the shared UDP port.
seedwell-utp = { path = "../utp" }
# NAT-PMP / PCP / UPnP port mapping for the listen port.
seedwell-portmap = { path = "../portmap" }
# Torrent traffic through a SOCKS5 proxy (SPEC §7H).
seedwell-socks = { path = "../socks" }
# Play while downloading (SPEC 7F): the loopback range server and its `PieceSource` contract.
seedwell-stream = { path = "../stream" }
# Runtime, sockets, timers, channels. No `full`: only what the engine uses.
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "net", "time", "sync", "macros", "io-util", "fs"] }
# Zero-copy receive buffers shared with seedwell-wire.
bytes = { version = "1", default-features = false }
# OS entropy for the per-process tracker `key` and the engine's shuffle RNG seed.
getrandom = { version = "0.4", default-features = false }

[dev-dependencies]
seedwell-socks = { path = "../socks", features = ["testkit"] }
tokio = { version = "1", default-features = false, features = ["process"] }
tempfile = "3"
serde_json = { version = "1", default-features = false, features = ["std"] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
