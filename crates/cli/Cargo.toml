[package]
name = "seedwell-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "The `seedwell` command: CLI for the control socket, the embedded Agent Skill and the headless daemon (`seedwell daemon`)"

[lib]
name = "seedwell_cli"
path = "src/lib.rs"

[[bin]]
name = "seedwell"
path = "src/main.rs"

[features]
default = ["daemon"]
# `seedwell daemon`: the engine, persistence and the control socket in one headless process.
daemon = ["dep:seedwell-engine", "dep:seedwell-storage", "dep:seedwell-state", "dep:seedwell-sync-net", "dep:seedwell-sync-proto", "seedwell-control/engine", "seedwell-control/sync", "tokio/signal", "tokio/rt-multi-thread"]

[dependencies]
seedwell-platform = { path = "../platform" }
seedwell-control = { path = "../control", default-features = false }
# `seedwell log trackers`: the same renderer as the app's viewer, and the local-file fallback.
seedwell-devlog = { path = "../devlog" }
seedwell-engine = { path = "../engine", optional = true }
# The daemon's global allocator (`MappedAlloc`); the thin client does not link it.
seedwell-storage = { path = "../storage", optional = true }
seedwell-state = { path = "../state", optional = true }
# The daemon runs the folder sync service next to the engine (and `seedwell relay`).
seedwell-sync-net = { path = "../sync-net", optional = true }
# The relay's device key (`seedwell relay`).
seedwell-sync-proto = { path = "../sync-proto", optional = true }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
# `seedwell mail --attach`: each attached file carries its SHA-256, checked when it is saved.
sha2 = { version = "0.11", default-features = false }
# `net` for the sim swarm, `time` for timeouts and rate pacing.
tokio = { version = "1", default-features = false, features = ["rt", "macros", "io-util", "time", "sync", "net"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "process", "time", "io-util"] }
# Test torrents are hashed with the engine's own SHA-1.
seedwell-storage = { path = "../storage" }
