[package]
name = "seedwell-sync-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Folder sync driver: TLS sessions between devices, discovery, relays and the folder runtime over seedwell-sync (SPEC 7G)"

[dependencies]
seedwell-platform = { path = "../platform" }
# Each dependency is justified in README.md.
seedwell-sync = { path = "../sync" }
seedwell-sync-proto = { path = "../sync-proto" }
seedwell-fswatch = { path = "../fswatch" }
seedwell-utp = { path = "../utp" }
seedwell-rendezvous = { path = "../rendezvous" }
seedwell-media = { path = "../media" }
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "sync", "io-util", "macros"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
ring = { version = "0.17", default-features = false, features = ["std"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
toml = { version = "1", default-features = false, features = ["std", "parse", "display", "serde"] }
socket2 = { version = "0.6", default-features = false, features = ["all"] }

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
seedwell-rendezvous = { path = "../rendezvous", features = ["testkit"] }
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "net", "time", "sync", "io-util", "macros", "test-util"] }
tempfile = "3"
