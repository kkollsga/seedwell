[package]
name = "trs-state"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Persistent state for Seedwell: config, rules, tracker profiles, redb database, statistics"

[dependencies]
redb = "2"
serde = { version = "1", default-features = false, features = ["derive", "std"] }
toml = { version = "1", default-features = false, features = ["std", "parse", "display", "serde", "preserve_order"] }
# Only for `TimingStore`; the async transports are not needed here.
trs-tracker = { path = "../tracker", default-features = false }
# Only for the `Category` enum.
trs-classify = { path = "../classify" }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
