[package]
name = "trs-utp-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
trs-utp = { path = ".." }

# Standalone: not part of the Seedwell workspace (fuzzers need nightly and libFuzzer).
[workspace]

[[bin]]
name = "packet_parse"
path = "fuzz_targets/packet_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "endpoint_datagrams"
path = "fuzz_targets/endpoint_datagrams.rs"
test = false
doc = false
bench = false
