[package]
name = "trs-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "UniFFI surface between the Rust core and the Swift shell"

[lib]
name = "trs_ffi"
# staticlib is linked into the app; lib lets the bindgen binary and tests use it.
crate-type = ["staticlib", "lib"]

[features]
# Only the bindgen binary needs clap & friends; keep them out of the app's static library.
bindgen = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[dependencies]
# Held at 0.31 while uniffi-bindgen-cs (the Windows app's C# bindings) supports nothing newer; the Rust side
# and every generator must be on the same UniFFI version. Move on when it does (docs/CROSS-PLATFORM.md).
uniffi = { version = "0.31", default-features = false }
trs-engine = { path = "../engine" }
# `MappedAlloc`, the app's global allocator (big blocks leave the footprint when freed).
trs-storage = { path = "../storage" }
trs-state = { path = "../state" }
trs-classify = { path = "../classify" }
trs-control = { path = "../control" }
trs-platform = { path = "../platform" }
# Folder sync (SPEC 7G): the service's handle, its secret store and status, keys and links.
trs-sync-net = { path = "../sync-net" }
trs-sync-proto = { path = "../sync-proto" }
# Conflict copy names read back (device and time, for the folder page).
trs-sync = { path = "../sync" }
trs-tracker = { path = "../tracker" }
# Developer mode: the tracker log viewer reads and clears the log.
trs-devlog = { path = "../devlog" }
# Content types and container families of file names (the Play entries); the server itself is the engine's.
trs-stream = { path = "../stream" }
# Runtime handle, broadcast receiver for engine events, timers; `net` for the update check's request.
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time", "net"] }
# The update check: one small GET of `latest.json` (the downloads' client and redirect rules), the document read
# and what is kept between launches (`updates.json`).
trs-http = { path = "../http" }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
# Development builds (SPEC 12A): a handed-over zip's checksum, and the watched folder's change notifications.
sha2 = { version = "0.11", default-features = false }
trs-fswatch = { path = "../fswatch" }

[dev-dependencies]
tempfile = "3"
