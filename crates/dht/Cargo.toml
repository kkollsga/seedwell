[package]
name = "trs-dht"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Mainline DHT (BEP 5/42/43): sans-I/O core plus a thin tokio UDP driver"

[dependencies]
# Each dependency is justified in README.md.
tokio = { version = "1", default-features = false, features = ["net", "time", "sync", "rt", "macros"] }

[dev-dependencies]
trs-bencode = { path = "../bencode" }
proptest = { version = "1", default-features = false, features = ["std"] }
sha1 = { version = "0.11", default-features = false }
tokio = { version = "1", default-features = false, features = ["net", "time", "sync", "rt", "rt-multi-thread", "macros"] }
