[package]
name = "trs-sync"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Folder sync core: scanner, chunker, index, planner, puller and conflict rules over an injected filesystem (SPEC 7G)"

[dependencies]
# Each dependency is justified in README.md.
trs-sync-proto = { path = "../sync-proto" }
redb = "4"
sha2 = { version = "0.11", default-features = false }
unicode-normalization = { version = "0.1", default-features = false, features = ["std"] }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
tempfile = "3"
